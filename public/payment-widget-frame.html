<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payment Widget</title>
  <style>
    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #1f2430;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #e2e5ea;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 10px;
    }
    button {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      background: #0d9488;
      color: #fff;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 8px;
      color: #667085;
    }
  </style>
</head>
<body>
  <form data-testid="payment-card-form">
    <label for="payment-card-number">Card number</label>
    <input
      type="text"
      id="payment-card-number"
      data-testid="payment-card-number-input"
      inputmode="numeric"
      autocomplete="cc-number"
      placeholder="4242 4242 4242 4242"
    />
    <button type="submit" data-testid="payment-card-submit-button">Use this card</button>
  </form>
  <p class="status" data-testid="payment-card-status"></p>

  <script>
    // This document is loaded in an iframe sandboxed WITHOUT allow-same-origin, so it
    // runs with an opaque origin: the parent page's DOM/JS cannot reach into this frame,
    // and this frame can't reach the parent's cookies/localStorage either. The only way
    // data crosses that boundary is this explicit postMessage — simulating a real
    // third-party payment widget (e.g. Stripe Elements) embedded in a checkout page.
    (function () {
      "use strict";

      var form = document.querySelector('[data-testid="payment-card-form"]');
      var input = document.querySelector('[data-testid="payment-card-number-input"]');
      var submitBtn = document.querySelector('[data-testid="payment-card-submit-button"]');
      var status = document.querySelector('[data-testid="payment-card-status"]');

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var cardNumber = input.value.replace(/\s+/g, "");
        submitBtn.disabled = true;
        status.textContent = "Card submitted for processing...";
        window.parent.postMessage({ type: "payment-widget:card-submitted", cardNumber: cardNumber }, "*");
      });

      window.addEventListener("message", function (event) {
        if (!event.data || event.data.type !== "payment-widget:reset") return;
        submitBtn.disabled = false;
        status.textContent = "";
      });
    })();
  </script>
</body>
</html>
