<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · HourToLearn Practice Site</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body data-page="login">
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="page-header">
        <h1 class="page-title" data-testid="page-title">Login</h1>
        <p class="page-description">A real login form backed by a session cookie, for authentication and redirect practice.</p>
      </header>

      <section class="page-body">
        <div class="card auth-card">
          <h2 class="card-title">Sign in</h2>
          <p class="card-subtitle">Use the demo credentials below to sign in.</p>

          <div id="login-success-message" class="alert alert-success" role="status" data-testid="login-success-message" hidden></div>
          <div id="login-error-message" class="alert alert-error" role="alert" data-testid="login-error-message" hidden></div>

          <form id="login-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="login-username">Username</label>
              <input class="form-input" type="text" id="login-username" name="username" data-testid="login-username" autocomplete="username" />
            </div>

            <div class="form-group">
              <label class="form-label" for="login-password">Password</label>
              <input class="form-input" type="password" id="login-password" name="password" data-testid="login-password" autocomplete="current-password" />
            </div>

            <p class="form-hint" data-testid="login-demo-credentials">
              Demo credentials — username: <strong>student</strong>, password: <strong>Learn123!</strong>
            </p>

            <button class="btn" type="submit" data-testid="login-submit">Sign in</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/nav-loader.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
